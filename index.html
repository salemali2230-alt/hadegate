    <script>
      // Automatically redirect to built dist directory if loaded from static GitHub Pages root
      if (window.location.hostname.includes('github.io') && !window.location.pathname.includes('/dist/')) {
        var p = window.location.pathname;
        if (p.endsWith('index.html')) {
          p = p.substring(0, p.lastIndexOf('index.html'));
        }
        if (!p.endsWith('/')) {
          p += '/';
        }
        window.location.replace(p + 'dist/' + window.location.search + window.location.hash);
      }
    </script>
